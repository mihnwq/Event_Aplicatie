<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffdf60">
<meta name="description" content="Side Challenge 3000 - jocuri random, timer, echipe si castigatori.">
<meta name="app-build" content="bracket-2026-11-25">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<title>SIDE CHALLENGE 3000 !!</title>
<style>
:root {
    --ink: #202023;
    --paper: #fbfaf5;
    --yellow: #ffdf60;
    --pink: #ff96c3;
    --blue: #9cd6f4;
    --green: #a1ec95;
    --lav: #c1a6f4;
    --red: #ff9079;
    --muted: #6c6971;
    --white: #fff;
    --border: 3px solid var(--ink);
    --sh: 5px 5px 0 var(--ink);
}

* {
    box-sizing: border-box;
}

html,body {
    min-height: 100%;
    margin: 0;
}

body {
    font-family: 'Trebuchet MS',Arial,sans-serif;
    color: var(--ink);
    background: #f5f0df;
    background-image: linear-gradient(#2221 1px,transparent 1px),linear-gradient(90deg,#2221 1px,transparent 1px);
    background-size: 29px 29px;
}

button,input,textarea,select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
    opacity: .48;
    filter: grayscale(1);
}

.app {
    max-width: 1470px;
    margin: auto;
    padding: 14px 20px 60px;
}

.topbar {
    background: var(--paper);
    border: var(--border);
    box-shadow: var(--sh);
    padding: 10px 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transform: rotate(-.2deg);
}

.brand {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
}

.mark {
    font-size: 27px;
    font-family: Impact,'Arial Black',sans-serif;
    letter-spacing: -2px;
    background: var(--pink);
    border: 3px solid var(--ink);
    width: 55px;
    height: 55px;
    display: grid;
    place-items: center;
    transform: rotate(-9deg);
    flex-shrink: 0;
    box-shadow: 3px 3px 0 var(--ink);
}

.brand-title {
    margin: 0;
    font-family: Impact,'Arial Black',sans-serif;
    letter-spacing: 1px;
    font-size: clamp(19px,2.2vw,31px);
    line-height: 1;
}

.brand-title .dot {
    color: #e52c63;
}

.brand-sub {
    font-family: 'Comic Sans MS','Trebuchet MS',sans-serif;
    font-size: 12px;
    color: #777;
    margin-top: 3px;
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.status-pill {
    background: var(--green);
    font: 700 12px 'Courier New',monospace;
    padding: 9px;
    border: 2px solid var(--ink);
    transform: rotate(2deg);
    white-space: nowrap;
}

.mini-btn {
    padding: 8px 12px;
    background: white;
    border: 2px solid var(--ink);
    font-weight: 900;
    box-shadow: 2px 2px 0 var(--ink);
}

.nav {
    display: flex;
    gap: 10px;
    margin: 22px 0 17px;
    flex-wrap: wrap;
}

.nav-btn {
    background: #fff;
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 10px 15px;
    font-weight: 900;
    font-family: 'Courier New',monospace;
    font-size: 13px;
    transform: rotate(-1deg);
    white-space: nowrap;
}

.nav-btn:nth-child(2n) {
    transform: rotate(1deg);
}

.nav-btn.active {
    background: var(--yellow);
    transform: translate(2px,2px) rotate(0);
    box-shadow: 1px 1px 0 var(--ink);
}

.nav-btn:hover,.btn:hover:not(:disabled),.mini-btn:hover {
    filter: brightness(.96);
}

.eyebrow {
    font: 900 13px 'Courier New',monospace;
    text-transform: uppercase;
    letter-spacing: .4px;
}

.page-title {
    font: 900 clamp(25px,4.7vw,48px) Impact,'Arial Black',sans-serif;
    letter-spacing: 1px;
    margin: 0 0 5px;
}

.page-lead {
    font-size: 14px;
    color: #655f63;
    margin: 0 0 18px;
}

.dashboard {
    display: grid;
    grid-template-columns: minmax(215px,.83fr) minmax(390px,1.65fr) minmax(240px,1fr);
    gap: 18px;
    align-items: start;
}

.panel,.card {
    border: var(--border);
    background: #fffdf7;
    box-shadow: var(--sh);
}

.panel {
    padding: 17px;
}

.panel-title {
    margin: 0 0 13px;
    font: 900 17px 'Courier New',monospace;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.small-stamp {
    border: 2px solid var(--ink);
    background: var(--pink);
    font: 900 10px 'Courier New',monospace;
    padding: 4px;
    transform: rotate(8deg);
}

.setting-row {
    margin: 12px 0;
}

.field-name {
    display: block;
    font: 800 12px 'Courier New',monospace;
    margin-bottom: 7px;
    text-transform: uppercase;
}

.select,.field {
    background: #fff;
    border: 2px solid var(--ink);
    padding: 11px;
    width: 100%;
    color: var(--ink);
    border-radius: 0;
    min-height: 42px;
}

.field:focus,.select:focus,.area:focus {
    outline: 3px solid #ffbf45;
    outline-offset: 1px;
}

.inline-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.help {
    font-size: 12px;
    line-height: 1.45;
    color: #726e75;
}

.hint-tape {
    font: 700 13px 'Comic Sans MS','Trebuchet MS',sans-serif;
    background: #fdf1ad;
    transform: rotate(-2deg);
    padding: 11px 10px;
    margin: 17px 0 8px;
    border-left: 4px dashed #9f8632;
}

.big-panel {
    padding: 20px 21px 19px;
    background: #fffdfa;
    position: relative;
    overflow: hidden;
}

.big-panel:after {
    content: '✳';
    position: absolute;
    right: 13px;
    top: 0;
    font-size: 76px;
    color: #e1c6f5;
    pointer-events: none;
    transform: rotate(17deg);
}

.machine-label {
    position: relative;
    z-index: 1;
    display: inline-block;
    border: 3px solid var(--ink);
    background: var(--blue);
    font: 900 12px 'Courier New',monospace;
    padding: 7px 12px;
    transform: rotate(-2deg);
}

.challenge-name {
    position: relative;
    z-index: 1;
    font: 900 clamp(32px,4.2vw,58px) Impact,'Arial Black',sans-serif;
    margin: 20px 0 8px;
    letter-spacing: .5px;
    line-height: 1.05;
    overflow-wrap: anywhere;
}

.challenge-desc {
    position: relative;
    z-index: 1;
    margin: 8px 0 11px;
    font-size: 15px;
    line-height: 1.5;
    min-height: 44px;
}

.info-chips {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin: 13px 0;
}

.chip {
    display: inline-block;
    font: 900 11px 'Courier New',monospace;
    border: 2px solid var(--ink);
    padding: 6px 8px;
    background: #eee;
}

.chip.easy {
    background: var(--green);
}

.chip.hard {
    background: var(--red);
}

.chip.cat {
    background: var(--lav);
}

.chip.time {
    background: var(--yellow);
}

.timer-box {
    border: 3px dashed #222;
    background: #fff8d9;
    text-align: center;
    padding: 11px 5px 13px;
    margin: 15px 0 12px;
    position: relative;
}

.timer-nums {
    font: 900 clamp(56px,9.6vw,106px) 'Courier New',monospace;
    letter-spacing: -8px;
    line-height: 1.1;
    margin-right: 8px;
    font-variant-numeric: tabular-nums;
}

.timer-label {
    font: 900 12px 'Courier New',monospace;
    margin-top: 3px;
}

.timer-box.done {
    background: #ffc7be;
    animation: tickAlert 1s infinite;
}

.timer-box.live {
    background: #eeffe3;
}

.progress {
    height: 14px;
    border-top: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink);
    background: #efede6;
    margin: 12px -0px 0;
    overflow: hidden;
}

.progress>.bar {
    background: #fe99b4;
    height: 100%;
    border-right: 3px solid var(--ink);
    transition: width .2s linear;
}

.btn {
    padding: 12px 14px;
    border: 3px solid var(--ink);
    font-family: 'Courier New',monospace;
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    background: #fff;
    box-shadow: 4px 4px 0 var(--ink);
    position: relative;
    min-height: 44px;
}

.btn:active:not(:disabled) {
    transform: translate(3px,3px);
    box-shadow: 1px 1px 0 var(--ink);
}

.btn.primary {
    background: var(--yellow);
}

.btn.green {
    background: var(--green);
}

.btn.red {
    background: var(--red);
}

.btn.blue {
    background: var(--blue);
}

.btn.pink {
    background: var(--pink);
}

.btn.lav {
    background: var(--lav);
}

.btn.sm {
    min-height: 35px;
    padding: 7px 10px;
    font-size: 11px;
    box-shadow: 2px 2px 0 var(--ink);
}

.btn.full {
    width: 100%;
}

.btn.row-btn {
    flex: 1;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 13px 0 0;
}

.machine-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    border-top: 2px dashed #a7a2a5;
    padding-top: 13px;
    flex-wrap: wrap;
}

.scribble {
    font-family: 'Comic Sans MS','Trebuchet MS',sans-serif;
    font-size: 13px;
    transform: rotate(-3deg);
    color: #97685f;
}

.team-mini {
    border: 2px solid var(--ink);
    background: #fff;
    padding: 10px 8px;
    margin: 9px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

.team-mini b {
    font-size: 13px;
    overflow-wrap: anywhere;
}

.team-mini small {
    color: #6a6870;
    font-size: 11px;
    display: block;
    margin-top: 2px;
}

.team-bullet {
    width: 13px;
    height: 13px;
    border: 2px solid #222;
    display: inline-block;
    margin-right: 6px;
    transform: rotate(-10deg);
}

.team-mini .status-buttons {
    display: flex;
    gap: 4px;
}

.status-buttons button {
    border: 2px solid var(--ink);
    background: #fff;
    font: 900 10px 'Courier New',monospace;
    padding: 7px 8px;
}

.status-buttons button.yes.sel {
    background: var(--green);
}

.status-buttons button.no.sel {
    background: var(--red);
}

.empty-mini {
    font-size: 12px;
    color: #666;
    padding: 10px 0;
}

.muted {
    color: #6f6b6f;
}

.notice {
    padding: 11px;
    border: 2px dashed var(--ink);
    font: 700 13px 'Courier New',monospace;
    background: #fff2ca;
    margin: 10px 0;
}

.sidebar-meta {
    border-top: 2px dashed #bbb;
    padding-top: 12px;
    margin-top: 15px;
}

.stat {
    font: 900 12px 'Courier New',monospace;
    margin: 11px 0;
}

.stat strong {
    font-size: 20px;
    display: block;
    margin-top: 4px;
}

.row-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    margin: 2px 0 18px;
}

.summary-cards {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 15px;
    margin: 0 0 19px;
}

.summary-box {
    border: 3px solid #222;
    background: #fff;
    box-shadow: 4px 4px 0 #222;
    padding: 16px;
}

.summary-box:nth-child(2) {
    background: #e6f7df;
}

.summary-box:nth-child(3) {
    background: #ffdfef;
}

.summary-value {
    font: 900 30px 'Courier New',monospace;
}

.summary-text {
    font-size: 12px;
    font-weight: 800;
    margin-top: 3px;
}

.list-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 16px;
}

.item-card {
    padding: 16px;
    background: #fff;
    min-width: 0;
}

.item-card.is-off {
    opacity: .62;
}

.item-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
}

.item-card h3 {
    font: 900 22px Impact,'Arial Black',sans-serif;
    letter-spacing: .2px;
    margin: 8px 0;
    overflow-wrap: anywhere;
}

.item-card p {
    font-size: 13px;
    line-height: 1.5;
    min-height: 40px;
}

.row-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.row-actions {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-top: 14px;
}

.row-actions .btn {
    flex: 1;
}

.team-list {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 17px;
}

.team-card {
    padding: 17px;
    background: #fff;
}

.team-card h3 {
    font: 900 26px Impact,'Arial Black',sans-serif;
    margin: 7px 0 14px;
    overflow-wrap: anywhere;
}

.member-chip {
    display: inline-block;
    background: #f7f5ff;
    border: 2px solid #222;
    padding: 7px 9px;
    margin: 0 5px 8px 0;
    font-size: 12px;
    font-weight: 800;
}

.member-count {
    font: 800 12px 'Courier New',monospace;
    margin: 9px 0;
}

.history-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.history-card {
    padding: 15px 16px;
    background: #fff;
}

.history-header {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
}

.history-title {
    font: 900 24px Impact,'Arial Black',sans-serif;
    margin: 6px 0;
}

.history-card p {
    font-size: 13px;
    margin: 8px 0;
}

.winner {
    background: #c6f8ba;
    border: 2px solid var(--ink);
    padding: 8px 10px;
    font: 900 13px 'Courier New',monospace;
    display: inline-block;
    max-width: 100%;
    overflow-wrap: anywhere;
}

.loss {
    background: #ffe0dc;
    border: 2px solid var(--ink);
    padding: 7px 9px;
    font: 800 12px 'Courier New',monospace;
    display: inline-block;
}

.settings-grid {
    display: grid;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    gap: 18px;
}

.area {
    border: 2px solid var(--ink);
    border-radius: 0;
    padding: 11px;
    min-height: 95px;
    resize: vertical;
    width: 100%;
    background: white;
}

.form-stack {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.toggle-line {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 800;
    font-size: 13px;
}

.toggle-line input {
    height: 18px;
    width: 18px;
    accent-color: #4943a3;
}

.rule {
    height: 0;
    border: 0;
    border-top: 2px dashed #999;
    margin: 19px 0;
}

.form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    flex-wrap: wrap;
    margin-top: 17px;
}

.overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(17,16,20,.64);
    padding: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
}

.dialog {
    border: 4px solid #222;
    box-shadow: 10px 10px 0 #111;
    background: #fffdfa;
    width: min(570px,100%);
    max-height: calc(100vh - 36px);
    overflow-y: auto;
    padding: 20px 23px;
    transform: rotate(-.3deg);
}

.dialog.wide {
    width: min(840px,100%);
}

.dialog-head {
    display: flex;
    align-items: start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 9px;
}

.dialog-title {
    font: 900 35px Impact,'Arial Black',sans-serif;
    letter-spacing: 1px;
    margin: 0;
    line-height: 1.06;
}

.close-x {
    background: var(--red);
    border: 3px solid #222;
    font: 900 18px 'Courier New',monospace;
    min-width: 36px;
    height: 36px;
    box-shadow: 2px 2px 0 #222;
}

.modal-info {
    font-size: 14px;
    line-height: 1.5;
}

.result-choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 16px 0;
}

.result-choice {
    border: 2px solid #222;
    padding: 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
}

.result-choice .status-buttons button {
    font-size: 13px;
    padding: 9px 12px;
}

.win-banner {
    background: #ffffa2;
    border: 3px dashed #222;
    text-align: center;
    padding: 20px 10px;
    margin: 12px 0;
    transform: rotate(-1deg);
}

.win-banner h3 {
    font: 900 35px Impact,'Arial Black',sans-serif;
    margin: 7px 0;
    overflow-wrap: anywhere;
}

.nothing {
    border: 3px dashed #222;
    background: #fffdf6;
    padding: 35px 15px;
    text-align: center;
}

.nothing .big {
    font-size: 48px;
}

.toast {
    position: fixed;
    z-index: 90;
    bottom: 23px;
    left: 50%;
    transform: translateX(-50%) rotate(-1deg);
    border: 3px solid #222;
    background: #ffdf60;
    padding: 13px 18px;
    font: 900 14px 'Courier New',monospace;
    box-shadow: 5px 5px 0 #222;
    max-width: calc(100% - 22px);
}

.footer {
    padding: 22px 2px;
    font-size: 12px;
    color: #5f5a60;
    font-family: 'Courier New',monospace;
}

.split {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.counter {
    font: 800 12px 'Courier New',monospace;
}

.tiny {
    font-size: 11px;
}

.accent {
    color: #c34164;
}

.icon-scribble {
    font-size: 26px;
    line-height: 1;
}

.schedule-badge {
    display: inline-block;
    background: #e9dbff;
    border: 2px solid var(--ink);
    font: 900 12px 'Courier New',monospace;
    padding: 6px;
    margin: 8px 0;
    overflow-wrap: anywhere;
}

.readonly {
    background: #eee;
}

.autosave {
    color: #61605d;
    font-size: 11px;
    text-align: right;
}

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
}

@keyframes tickAlert {
    50% {
        background: #fff0cb;
    }
}

@media (max-width:1160px) {
    .dashboard {
        grid-template-columns: 230px minmax(0,1fr);
    }
    .dashboard>.panel:last-child {
        grid-column: 1/-1;
    }
    .dashboard>.panel:last-child .team-mini {
        display: inline-flex;
        vertical-align: top;
        min-width: 215px;
        margin: 6px;
    }
    .team-list {
        grid-template-columns: repeat(2,minmax(0,1fr));
    }
}

@media (max-width:740px) {
    .app {
        padding: 9px 11px 35px;
    }
    .topbar {
        padding: 9px;
    }
    .mark {
        width: 44px;
        height: 44px;
        font-size: 23px;
    }
    .brand-title {
        font-size: 20px;
    }
    .brand-sub {
        font-size: 10px;
    }
    .status-pill {
        display: none;
    }
    .nav {
        gap: 8px;
        margin: 16px 0 18px;
    }
    .nav-btn {
        font-size: 11px;
        padding: 9px 10px;
    }
    .dashboard {
        display: flex;
        flex-direction: column;
    }
    .dashboard>.panel {
        width: 100%;
    }
    .dashboard>.big-panel {
        order: -1;
    }
    .big-panel {
        padding: 17px;
    }
    .dashboard>.panel:last-child .team-mini {
        display: flex;
    }
    .timer-nums {
        font-size: clamp(56px,13vw,90px);
    }
    .list-grid,.team-list,.settings-grid {
        grid-template-columns: 1fr;
    }
    .summary-cards {
        gap: 8px;
    }
    .summary-box {
        padding: 10px;
    }
    .summary-value {
        font-size: 25px;
    }
    .page-title {
        font-size: 35px;
    }
    .item-card p {
        min-height: 0;
    }
    .dialog {
        padding: 16px;
    }
    .dialog-title {
        font-size: 28px;
    }
}

@media (max-width:420px) {
    .top-actions .mini-btn {
        display: none;
    }
    .nav-btn {
        flex: 1;
        text-align: center;
    }
    .team-mini .status-buttons {
        width: 100%;
    }
    .machine-bottom {
        align-items: stretch;
    }
    .timer-nums {
        letter-spacing: -5px;
    }
    .btn {
        font-size: 12px;
