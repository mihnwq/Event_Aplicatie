<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffdf60">
<meta name="description" content="Side Challenge 3000 - jocuri random, timer, echipe si castigatori.">
<meta name="app-build" content="fix-2026-11-24-score">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<title>SIDE CHALLENGE 3000 !!</title>
<style>
:root {
    --ink: #202023;
    --paper: #fbfaf5;
    --yellow: #ffdf60;
    --pink: #ff96c3;
    --blue: #9cd6f4;
    --green: #a1ec95;
    --lav: #c1a6f4;
    --red: #ff9079;
    --muted: #6c6971;
    --white: #fff;
    --border: 3px solid var(--ink);
    --sh: 5px 5px 0 var(--ink);
}

* {
    box-sizing: border-box;
}

html,body {
    min-height: 100%;
    margin: 0;
}

body {
    font-family: 'Trebuchet MS',Arial,sans-serif;
    color: var(--ink);
    background: #f5f0df;
    background-image: linear-gradient(#2221 1px,transparent 1px),linear-gradient(90deg,#2221 1px,transparent 1px);
    background-size: 29px 29px;
}

button,input,textarea,select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
    opacity: .48;
    filter: grayscale(1);
}

.app {
    max-width: 1470px;
    margin: auto;
    padding: 14px 20px 60px;
}

.topbar {
    background: var(--paper);
    border: var(--border);
    box-shadow: var(--sh);
    padding: 10px 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transform: rotate(-.2deg);
}

.brand {
    display: flex;
    align-items: center;
    gap: 13px;
    min-width: 0;
}

.mark {
    font-size: 27px;
    font-family: Impact,'Arial Black',sans-serif;
    letter-spacing: -2px;
    background: var(--pink);
    border: 3px solid var(--ink);
    width: 55px;
    height: 55px;
    display: grid;
    place-items: center;
    transform: rotate(-9deg);
    flex-shrink: 0;
    box-shadow: 3px 3px 0 var(--ink);
}

.brand-title {
    margin: 0;
    font-family: Impact,'Arial Black',sans-serif;
    letter-spacing: 1px;
    font-size: clamp(19px,2.2vw,31px);
    line-height: 1;
}

.brand-title .dot {
    color: #e52c63;
}

.brand-sub {
    font-family: 'Comic Sans MS','Trebuchet MS',sans-serif;
    font-size: 12px;
    color: #777;
    margin-top: 3px;
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.status-pill {
    background: var(--green);
    font: 700 12px 'Courier New',monospace;
    padding: 9px;
    border: 2px solid var(--ink);
    transform: rotate(2deg);
    white-space: nowrap;
}

.mini-btn {
    padding: 8px 12px;
    background: white;
    border: 2px solid var(--ink);
    font-weight: 900;
    box-shadow: 2px 2px 0 var(--ink);
}

.nav {
    display: flex;
    gap: 10px;
    margin: 22px 0 17px;
    flex-wrap: wrap;
}

.nav-btn {
    background: #fff;
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 10px 15px;
    font-weight: 900;
    font-family: 'Courier New',monospace;
    font-size: 13px;
    transform: rotate(-1deg);
    white-space: nowrap;
}

.nav-btn:nth-child(2n) {
    transform: rotate(1deg);
}

.nav-btn.active {
    background: var(--yellow);
    transform: translate(2px,2px) rotate(0);
    box-shadow: 1px 1px 0 var(--ink);
}

.nav-btn:hover,.btn:hover:not(:disabled),.mini-btn:hover {
    filter: brightness(.96);
}

.eyebrow {
    font: 900 13px 'Courier New',monospace;
    text-transform: uppercase;
    letter-spacing: .4px;
}

.page-title {
    font: 900 clamp(25px,4.7vw,48px) Impact,'Arial Black',sans-serif;
    letter-spacing: 1px;
    margin: 0 0 5px;
}

.page-lead {
    font-size: 14px;
    color: #655f63;
    margin: 0 0 18px;
}

.dashboard {
    display: grid;
    grid-template-columns: minmax(215px,.83fr) minmax(390px,1.65fr) minmax(240px,1fr);
    gap: 18px;
    align-items: start;
}

.panel,.card {
    border: var(--border);
    background: #fffdf7;
    box-shadow: var(--sh);
}

.panel {
    padding: 17px;
}

.panel-title {
    margin: 0 0 13px;
    font: 900 17px 'Courier New',monospace;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.small-stamp {
    border: 2px solid var(--ink);
    background: var(--pink);
    font: 900 10px 'Courier New',monospace;
    padding: 4px;
    transform: rotate(8deg);
}

.setting-row {
    margin: 12px 0;
}

.field-name {
    display: block;
    font: 800 12px 'Courier New',monospace;
    margin-bottom: 7px;
    text-transform: uppercase;
}

.select,.field {
    background: #fff;
    border: 2px solid var(--ink);
    padding: 11px;
    width: 100%;
    color: var(--ink);
    border-radius: 0;
    min-height: 42px;
}

.field:focus,.select:focus,.area:focus {
    outline: 3px solid #ffbf45;
    outline-offset: 1px;
}

.inline-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.help {
    font-size: 12px;
    line-height: 1.45;
    color: #726e75;
}

.hint-tape {
    font: 700 13px 'Comic Sans MS','Trebuchet MS',sans-serif;
    background: #fdf1ad;
    transform: rotate(-2deg);
    padding: 11px 10px;
    margin: 17px 0 8px;
    border-left: 4px dashed #9f8632;
}

.big-panel {
    padding: 20px 21px 19px;
    background: #fffdfa;
    position: relative;
    overflow: hidden;
}

.big-panel:after {
    content: '✳';
    position: absolute;
    right: 13px;
    top: 0;
    font-size: 76px;
    color: #e1c6f5;
    pointer-events: none;
    transform: rotate(17deg);
}

.machine-label {
    position: relative;
    z-index: 1;
    display: inline-block;
    border: 3px solid var(--ink);
    background: var(--blue);
    font: 900 12px 'Courier New',monospace;
    padding: 7px 12px;
    transform: rotate(-2deg);
}

.challenge-name {
    position: relative;
    z-index: 1;
    font: 900 clamp(32px,4.2vw,58px) Impact,'Arial Black',sans-serif;
    margin: 20px 0 8px;
    letter-spacing: .5px;
    line-height: 1.05;
    overflow-wrap: anywhere;
}

.challenge-desc {
    position: relative;
    z-index: 1;
    margin: 8px 0 11px;
    font-size: 15px;
    line-height: 1.5;
    min-height: 44px;
}

.info-chips {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin: 13px 0;
}

.chip {
    display: inline-block;
    font: 900 11px 'Courier New',monospace;
    border: 2px solid var(--ink);
    padding: 6px 8px;
    background: #eee;
}

.chip.easy {
    background: var(--green);
}

.chip.hard {
    background: var(--red);
}

.chip.cat {
    background: var(--lav);
}

.chip.time {
    background: var(--yellow);
}

.timer-box {
    border: 3px dashed #222;
    background: #fff8d9;
    text-align: center;
    padding: 11px 5px 13px;
    margin: 15px 0 12px;
    position: relative;
}

.timer-nums {
    font: 900 clamp(56px,9.6vw,106px) 'Courier New',monospace;
    letter-spacing: -8px;
    line-height: 1.1;
    margin-right: 8px;
    font-variant-numeric: tabular-nums;
}

.timer-label {
    font: 900 12px 'Courier New',monospace;
    margin-top: 3px;
}

.timer-box.done {
    background: #ffc7be;
    animation: tickAlert 1s infinite;
}

.timer-box.live {
    background: #eeffe3;
}

.progress {
    height: 14px;
    border-top: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink);
    background: #efede6;
    margin: 12px -0px 0;
    overflow: hidden;
}

.progress>.bar {
    background: #fe99b4;
    height: 100%;
    border-right: 3px solid var(--ink);
    transition: width .2s linear;
}

.btn {
    padding: 12px 14px;
    border: 3px solid var(--ink);
    font-family: 'Courier New',monospace;
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    background: #fff;
    box-shadow: 4px 4px 0 var(--ink);
    position: relative;
    min-height: 44px;
}

.btn:active:not(:disabled) {
    transform: translate(3px,3px);
    box-shadow: 1px 1px 0 var(--ink);
}

.btn.primary {
    background: var(--yellow);
}

.btn.green {
    background: var(--green);
}

.btn.red {
    background: var(--red);
}

.btn.blue {
    background: var(--blue);
}

.btn.pink {
    background: var(--pink);
}

.btn.lav {
    background: var(--lav);
}

.btn.sm {
    min-height: 35px;
    padding: 7px 10px;
    font-size: 11px;
    box-shadow: 2px 2px 0 var(--ink);
}

.btn.full {
    width: 100%;
}

.btn.row-btn {
    flex: 1;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 13px 0 0;
}

.machine-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    border-top: 2px dashed #a7a2a5;
    padding-top: 13px;
    flex-wrap: wrap;
}

.scribble {
    font-family: 'Comic Sans MS','Trebuchet MS',sans-serif;
    font-size: 13px;
    transform: rotate(-3deg);
    color: #97685f;
}

.team-mini {
    border: 2px solid var(--ink);
    background: #fff;
    padding: 10px 8px;
    margin: 9px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

.team-mini b {
    font-size: 13px;
    overflow-wrap: anywhere;
}

.team-mini small {
    color: #6a6870;
    font-size: 11px;
    display: block;
    margin-top: 2px;
}

.team-bullet {
    width: 13px;
    height: 13px;
    border: 2px solid #222;
    display: inline-block;
    margin-right: 6px;
    transform: rotate(-10deg);
}

.team-mini .status-buttons {
    display: flex;
    gap: 4px;
}

.status-buttons button {
    border: 2px solid var(--ink);
    background: #fff;
    font: 900 10px 'Courier New',monospace;
    padding: 7px 8px;
}

.status-buttons button.yes.sel {
    background: var(--green);
}

.status-buttons button.no.sel {
    background: var(--red);
}

.empty-mini {
    font-size: 12px;
    color: #666;
    padding: 10px 0;
}

.muted {
    color: #6f6b6f;
}

.notice {
    padding: 11px;
    border: 2px dashed var(--ink);
    font: 700 13px 'Courier New',monospace;
    background: #fff2ca;
    margin: 10px 0;
}

.sidebar-meta {
    border-top: 2px dashed #bbb;
    padding-top: 12px;
    margin-top: 15px;
}

.stat {
    font: 900 12px 'Courier New',monospace;
    margin: 11px 0;
}

.stat strong {
    font-size: 20px;
    display: block;
    margin-top: 4px;
}

.row-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    margin: 2px 0 18px;
}

.summary-cards {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 15px;
    margin: 0 0 19px;
}

.summary-box {
    border: 3px solid #222;
    background: #fff;
    box-shadow: 4px 4px 0 #222;
    padding: 16px;
}

.summary-box:nth-child(2) {
    background: #e6f7df;
}

.summary-box:nth-child(3) {
    background: #ffdfef;
}

.summary-value {
    font: 900 30px 'Courier New',monospace;
}

.summary-text {
    font-size: 12px;
    font-weight: 800;
    margin-top: 3px;
}

.list-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 16px;
}

.item-card {
    padding: 16px;
    background: #fff;
    min-width: 0;
}

.item-card.is-off {
    opacity: .62;
}

.item-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
}

.item-card h3 {
    font: 900 22px Impact,'Arial Black',sans-serif;
    letter-spacing: .2px;
    margin: 8px 0;
    overflow-wrap: anywhere;
}

.item-card p {
    font-size: 13px;
    line-height: 1.5;
    min-height: 40px;
}

.row-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.row-actions {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-top: 14px;
}

.row-actions .btn {
    flex: 1;
}

.team-list {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 17px;
}

.team-card {
    padding: 17px;
    background: #fff;
}

.team-card h3 {
    font: 900 26px Impact,'Arial Black',sans-serif;
    margin: 7px 0 14px;
    overflow-wrap: anywhere;
}

.member-chip {
    display: inline-block;
    background: #f7f5ff;
    border: 2px solid #222;
    padding: 7px 9px;
    margin: 0 5px 8px 0;
    font-size: 12px;
    font-weight: 800;
}

.member-count {
    font: 800 12px 'Courier New',monospace;
    margin: 9px 0;
}

.history-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.history-card {
    padding: 15px 16px;
    background: #fff;
}

.history-header {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
}

.history-title {
    font: 900 24px Impact,'Arial Black',sans-serif;
    margin: 6px 0;
}

.history-card p {
    font-size: 13px;
    margin: 8px 0;
}

.winner {
    background: #c6f8ba;
    border: 2px solid var(--ink);
    padding: 8px 10px;
    font: 900 13px 'Courier New',monospace;
    display: inline-block;
    max-width: 100%;
    overflow-wrap: anywhere;
}

.loss {
    background: #ffe0dc;
    border: 2px solid var(--ink);
    padding: 7px 9px;
    font: 800 12px 'Courier New',monospace;
    display: inline-block;
}

.settings-grid {
    display: grid;
    grid-template-columns: minmax(0,1fr) minmax(0,1fr);
    gap: 18px;
}

.area {
    border: 2px solid var(--ink);
    border-radius: 0;
    padding: 11px;
    min-height: 95px;
    resize: vertical;
    width: 100%;
    background: white;
}

.form-stack {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.toggle-line {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 800;
    font-size: 13px;
}

.toggle-line input {
    height: 18px;
    width: 18px;
    accent-color: #4943a3;
}

.rule {
    height: 0;
    border: 0;
    border-top: 2px dashed #999;
    margin: 19px 0;
}

.form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    flex-wrap: wrap;
    margin-top: 17px;
}

.overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(17,16,20,.64);
    padding: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
}

.dialog {
    border: 4px solid #222;
    box-shadow: 10px 10px 0 #111;
    background: #fffdfa;
    width: min(570px,100%);
    max-height: calc(100vh - 36px);
    overflow-y: auto;
    padding: 20px 23px;
    transform: rotate(-.3deg);
}

.dialog.wide {
    width: min(840px,100%);
}

.dialog-head {
    display: flex;
    align-items: start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 9px;
}

.dialog-title {
    font: 900 35px Impact,'Arial Black',sans-serif;
    letter-spacing: 1px;
    margin: 0;
    line-height: 1.06;
}

.close-x {
    background: var(--red);
    border: 3px solid #222;
    font: 900 18px 'Courier New',monospace;
    min-width: 36px;
    height: 36px;
    box-shadow: 2px 2px 0 #222;
}

.modal-info {
    font-size: 14px;
    line-height: 1.5;
}

.result-choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 16px 0;
}

.result-choice {
    border: 2px solid #222;
    padding: 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
}

.result-choice .status-buttons button {
    font-size: 13px;
    padding: 9px 12px;
}

.win-banner {
    background: #ffffa2;
    border: 3px dashed #222;
    text-align: center;
    padding: 20px 10px;
    margin: 12px 0;
    transform: rotate(-1deg);
}

.win-banner h3 {
    font: 900 35px Impact,'Arial Black',sans-serif;
    margin: 7px 0;
    overflow-wrap: anywhere;
}

.nothing {
    border: 3px dashed #222;
    background: #fffdf6;
    padding: 35px 15px;
    text-align: center;
}

.nothing .big {
    font-size: 48px;
}

.toast {
    position: fixed;
    z-index: 90;
    bottom: 23px;
    left: 50%;
    transform: translateX(-50%) rotate(-1deg);
    border: 3px solid #222;
    background: #ffdf60;
    padding: 13px 18px;
    font: 900 14px 'Courier New',monospace;
    box-shadow: 5px 5px 0 #222;
    max-width: calc(100% - 22px);
}

.footer {
    padding: 22px 2px;
    font-size: 12px;
    color: #5f5a60;
    font-family: 'Courier New',monospace;
}

.split {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.counter {
    font: 800 12px 'Courier New',monospace;
}

.tiny {
    font-size: 11px;
}

.accent {
    color: #c34164;
}

.icon-scribble {
    font-size: 26px;
    line-height: 1;
}

.schedule-badge {
    display: inline-block;
    background: #e9dbff;
    border: 2px solid var(--ink);
    font: 900 12px 'Courier New',monospace;
    padding: 6px;
    margin: 8px 0;
    overflow-wrap: anywhere;
}

.readonly {
    background: #eee;
}

.autosave {
    color: #61605d;
    font-size: 11px;
    text-align: right;
}

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
}

@keyframes tickAlert {
    50% {
        background: #fff0cb;
    }
}

@media (max-width:1160px) {
    .dashboard {
        grid-template-columns: 230px minmax(0,1fr);
    }
    .dashboard>.panel:last-child {
        grid-column: 1/-1;
    }
    .dashboard>.panel:last-child .team-mini {
        display: inline-flex;
        vertical-align: top;
        min-width: 215px;
        margin: 6px;
    }
    .team-list {
        grid-template-columns: repeat(2,minmax(0,1fr));
    }
}

@media (max-width:740px) {
    .app {
        padding: 9px 11px 35px;
    }
    .topbar {
        padding: 9px;
    }
    .mark {
        width: 44px;
        height: 44px;
        font-size: 23px;
    }
    .brand-title {
        font-size: 20px;
    }
    .brand-sub {
        font-size: 10px;
    }
    .status-pill {
        display: none;
    }
    .nav {
        gap: 8px;
        margin: 16px 0 18px;
    }
    .nav-btn {
        font-size: 11px;
        padding: 9px 10px;
    }
    .dashboard {
        display: flex;
        flex-direction: column;
    }
    .dashboard>.panel {
        width: 100%;
    }
    .dashboard>.big-panel {
        order: -1;
    }
    .big-panel {
        padding: 17px;
    }
    .dashboard>.panel:last-child .team-mini {
        display: flex;
    }
    .timer-nums {
        font-size: clamp(56px,13vw,90px);
    }
    .list-grid,.team-list,.settings-grid {
        grid-template-columns: 1fr;
    }
    .summary-cards {
        gap: 8px;
    }
    .summary-box {
        padding: 10px;
    }
    .summary-value {
        font-size: 25px;
    }
    .page-title {
        font-size: 35px;
    }
    .item-card p {
        min-height: 0;
    }
    .dialog {
        padding: 16px;
    }
    .dialog-title {
        font-size: 28px;
    }
}

@media (max-width:420px) {
    .top-actions .mini-btn {
        display: none;
    }
    .nav-btn {
        flex: 1;
        text-align: center;
    }
    .team-mini .status-buttons {
        width: 100%;
    }
    .machine-bottom {
        align-items: stretch;
    }
    .timer-nums {
        letter-spacing: -5px;
    }
    .btn {
        font-size: 12px;

<body>
<div id="app"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div>
<script>
(() => {
    'use strict';
    const KEY = 'sidechallenge-paint-v4';
    const CATEGORIES = ['Comunicare', 'Fizic', 'Gandire rapida', 'Altele'];
    const COLORS = { banana: '#ffe36f', pink: '#ffafd4', blue: '#a2dbff', green: '#b4eda2', lav: '#cbb2ff', orange: '#ffbb88' };
    const jocuri = [
        { id: 'pdf-1', name: 'Silent mode', category: 'Comunicare', difficulty: 'easy', duration: 45, description: 'Nu ai voie sa vorbesti. Comunici doar prin semne si gesturi.', active: true },
        { id: 'pdf-2', name: 'Telefonul fara fir', category: 'Comunicare', difficulty: 'easy', duration: 60, description: 'Primul primeste o propozitie de la organizator si o transmite in soapta. Ultimul trebuie sa o ghiceasca.', active: true },
        { id: 'pdf-3', name: 'Fara cuvinte interzise', category: 'Comunicare', difficulty: 'hard', duration: 45, description: 'Vorbiti fara sa folositi cuvintele interzise. Exemple: da, nu, eu.', active: true },
        { id: 'pdf-4', name: 'Rock paper scissors', category: 'Fizic', difficulty: 'easy', duration: 30, description: 'Doi reprezentanti se dueleaza la piatra, hartie, foarfeca. Castigatorul aduce avantaj echipei.', active: true },
        { id: 'pdf-5', name: 'Reflex test', category: 'Fizic', difficulty: 'easy', duration: 45, description: 'Prezentatorul spune cuvinte. Bati din palme doar cand auzi cuvantul stabilit.', active: true },
        { id: 'pdf-6', name: 'Freeze dance', category: 'Fizic', difficulty: 'easy', duration: 60, description: 'Dansezi cat canta muzica. Cand se opreste, ingheti. Cine se misca pierde.', active: true },
        { id: 'pdf-7', name: 'Switch', category: 'Fizic', difficulty: 'easy', duration: 30, description: 'Doi membri ai echipei isi schimba locurile si rolurile.', active: true },
        { id: 'pdf-8', name: '3 in 5 secunde', category: 'Gandire rapida', difficulty: 'easy', duration: 30, description: 'Enumera 3 lucruri dintr-o categorie in maxim 5 secunde. Exemplu: 3 branduri de bere.', active: true },
        { id: 'pdf-9', name: 'Word association', category: 'Gandire rapida', difficulty: 'hard', duration: 45, description: 'Fiecare spune un cuvant asociat cu ultimul auzit, fara repetari sau ezitari.', active: true },
        { id: 'pdf-10', name: 'Memory test', category: 'Gandire rapida', difficulty: 'easy', duration: 60, description: 'Arata 8 cuvinte timp de 5 secunde. Apoi echipa trebuie sa isi aminteasca cat mai multe.', active: true }
    ];
    const echipe = [{ id: 'demo-1', name: 'Echipa CARTOF', members: ['Ana', 'Vlad', 'Teo'], color: 'banana', score: 0 }, { id: 'demo-2', name: 'Echipa FULGER', members: ['Mara', 'Paul', 'Daria'], color: 'blue', score: 0 }, { id: 'demo-3', name: 'Echipa PANDA', members: ['Alex', 'Ioana', 'Radu'], color: 'pink', score: 0 }];
    const base = () => ({ version: 4, challenges: structuredCloneSafe(jocuri), teams: structuredCloneSafe(echipe), used: [], round: null, history: [], schedule: { mode: 'manual', fixed: 15, min: 10, max: 30 }, nextAutoAt: null, sound: true, points: 1, reward: 'Double points', lastChallengeId: null });
    let st = loadState(), pg = 'play', mod = null, tm = null, secOld = -1, audio = null;
    const el = (id) => document.getElementById(id);
    function structuredCloneSafe(v) { return JSON.parse(JSON.stringify(v)); }
    function uuid() { return (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2); }
    function escapeHtml(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function nrScor(n) {
        n = Number(n);
        return Number.isFinite(n) ? Math.max(0, Math.min(999999999, Math.floor(n))) : 0;
    }
    function nrPct(n) {
        n = Number(n);
        return Number.isFinite(n) ? Math.max(1, Math.min(1000, Math.floor(n))) : 1;
    }
    function scoruri(s) {
        s.points = nrPct(s.points);
        s.teams.forEach(t => t.score = nrScor(t.score));
        return s;
    }
    function pctRunda() {
        return nrPct(st.points) * (st.reward === 'Double points' ? 2 : 1);
    }
    function readState() { try {
        const r = JSON.parse(localStorage.getItem(KEY));
        if (!r || !Array.isArray(r.challenges) || !Array.isArray(r.teams) || !Array.isArray(r.history))
            return base();
        const d = base();
        return scoruri({ ...d, ...r, schedule: { ...d.schedule, ...r.schedule } });
    }
    catch {
        return base();
    } }
    function loadState() { return readState(); }
    function save() { try {
        localStorage.setItem(KEY, JSON.stringify(st));
        return true;
    }
    catch {
        notify('Salvarea permanenta este blocata! Deschide aplicatia de pe un site HTTPS.');
        return false;
    } }
    function rand(n) { if (n <= 1)
        return 0; if (globalThis.crypto && crypto.getRandomValues) {
        const a = new Uint32Array(1);
        crypto.getRandomValues(a);
        return a[0] % n;
    } return Math.floor(Math.random() * n); }
    function notify(msg) { el('toast-root').innerHTML = '<div class="toast" role="status">' + escapeHtml(msg) + '</div>'; clearTimeout(tm); tm = setTimeout(() => { el('toast-root').innerHTML = ''; }, 3200); }
    function playSound() { if (!st.sound)
        return; try {
        const ac = audio || (audio = new (window.AudioContext || window.webkitAudioContext)());
        if (ac.state === 'suspended')
            ac.resume();
        const start = ac.currentTime;
        for (let i = 0; i < 3; i++) {
            const o = ac.createOscillator(), g = ac.createGain();
            o.type = 'square';
            o.frequency.value = [740, 890, 740][i];
            o.connect(g);
            g.connect(ac.destination);
            g.gain.setValueAtTime(.0001, start + i * .2);
            g.gain.exponentialRampToValueAtTime(.065, start + i * .2 + .015);
            g.gain.exponentialRampToValueAtTime(.0001, start + i * .2 + .15);
            o.start(start + i * .2);
            o.stop(start + i * .2 + .16);
        }
    }
    catch { } }
    function durationHuman(ms) { const n = Math.ceil(Math.max(0, ms) / 1000); return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); }
    function dateLabel(ts) { return new Date(ts).toLocaleString('ro-RO', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
    function difficultyChip(c) { return '<span class="chip ' + (c.difficulty === 'hard' ? 'hard' : 'easy') + '">' + (c.difficulty === 'hard' ? 'GREU / ROSU' : 'USOR / VERDE') + '</span>'; }
    function categoryChip(c) { return '<span class="chip cat">' + escapeHtml(c.category) + '</span>'; }
    function timeChip(c) { return '<span class="chip time">' + Number(c.duration) + ' SEC</span>'; }
    function head() { const nr = st.challenges.filter(c => c.active).length; return `<header class="topbar"><div class="brand"><div class="mark">SC!</div><div><h1 class="brand-title">SIDE CHALLENGE <span class="dot">3000!!</span></h1><div class="brand-sub">aplicatia aia cu challenge-uri random. da, asta.</div></div></div><div class="top-actions"><span class="status-pill">● LOCAL + AUTO SAVE</span><button type="button" class="mini-btn" data-action="fullscreen" title="Afiseaza pe tot ecranul">[ ] FULL</button></div></header><nav class="nav" aria-label="Meniu">${[['play', '▶ JOACA ACUM'], ['challenges', '✎ CHALLENGE-URI'], ['teams', '♣ ECHIPE'], ['scores', '★ CLASAMENT'], ['history', '★ ISTORIC'], ['settings', '⚙ SETARI']].map(([v, n]) => `<button class="nav-btn ${pg === v ? 'active' : ''}" data-action="nav" data-view="${v}">${n}</button>`).join('')}</nav>`; }
    function render() { el('app').innerHTML = '<div class="app">' + head() + ({ play: renderPlay, challenges: renderChallenges, teams: renderTeams, scores: renderScores, history: renderHistory, settings: renderSettings }[pg] || renderPlay)() + `<footer class="footer">FACUT CU 3 PIXELI SI MULTA INCREDERE &nbsp; | &nbsp; ${st.challenges.length} CHALLENGE-URI (${st.challenges.filter(c => c.active).length} active) &nbsp; | &nbsp; datele se salveaza pe aparatul asta.</footer></div>`; renderModal(); updateLiveTime(); }
    function renderPlay() { let r = st.round, c = r?.challenge || null; const next = st.schedule.mode === 'manual' ? 'MANUAL - nu apare singur' : st.nextAutoAt ? dateLabel(st.nextAutoAt) : 'dupa runda'; const s = st.schedule; return `<div class="row-heading"><div><h2 class="page-title">MASINA DE CHALLENGE-URI <span class="accent">!!</span></h2><p class="page-lead">Dai random, bagi timer, vedem cine mai este in picioare.</p></div><div class="schedule-badge">URMATORUL: ${escapeHtml(next)}</div></div><section class="dashboard"><aside class="panel"><h3 class="panel-title">CONTROL PANEL <span class="small-stamp">100% real</span></h3><label class="field-name" for="mode-quick">MOD DE APARITIE</label><select id="mode-quick" class="select" data-change="quick-mode"><option value="manual" ${s.mode === 'manual' ? 'selected' : ''}>Manual, il pornesc eu</option><option value="fixed" ${s.mode === 'fixed' ? 'selected' : ''}>Auto / interval fix</option><option value="random" ${s.mode === 'random' ? 'selected' : ''}>Auto / interval random</option></select>${s.mode !== 'manual' ? `<div class="hint-tape">Urmatorul challenge apare automat cat timp aplicatia sta deschisa. Pe PC ai si lansator separat.</div><button class="btn sm" data-action="nav" data-view="settings">MODIFICA INTERVALUL</button>` : `<div class="hint-tape">Este pe manual. Nu sare nimica pe ecran cand nu vrei tu. (probabil)</div>`}<hr class="rule"><div class="stat">CHALLENGE-URI DISPONIBILE <strong>${st.challenges.filter(c => c.active).length}</strong></div><div class="stat">ECHIPE INSCRISE <strong>${st.teams.length}</strong></div><div class="stat">RUNDE TERMINATE <strong>${st.history.length}</strong></div><hr class="rule"><label class="field-name" for="reward-quick">RECOMPENSA / PUNISH</label><select id="reward-quick" data-change="quick-reward" class="select">${['Double points', '1 hint gratis', 'Handicap pt cine iese', 'Doar gloria', 'Alt premiu decis pe loc'].map(x => `<option ${x === st.reward ? 'selected' : ''}>${escapeHtml(x)}</option>`).join('')}</select><p class="help">Premiul se trece in istoric dupa ce ai ales castigatorii. Castigatorii primesc ${pctRunda()} PCT; echipele iesite primesc 0.</p></aside><section class="panel big-panel"><div class="machine-label">${c ? '! CHALLENGE TRAS LA SORTI !' : '? CE PICA AZI ?'}</div><h3 class="challenge-name">${c ? escapeHtml(c.name) : 'APASA RANDOM ↓'}</h3><p class="challenge-desc">${c ? escapeHtml(c.description) : 'Nimica inca. Apasa butonul mare si calculatorul alege unu.'}</p><div class="info-chips">${c ? categoryChip(c) + difficultyChip(c) + timeChip(c) : '<span class="chip cat">10 IDEI DIN PDF</span><span class="chip easy">HAI LA JOC</span>'}</div><div class="timer-box ${r ? (r.expired ? 'done' : r.running ? 'live' : '') : ''}"><div class="timer-nums" id="timer-digits">${durationHuman(r ? r.remainingMs : 45000)}</div><div class="timer-label" id="timer-phase">${r ? (r.expired ? 'TIMPU S-A GATAT!!' : r.running ? 'SE JOACA ACUMA' : 'PAUZA / PREGATIRE') : 'CRONOMETRU IN ASTEPTARE'}</div><div class="progress"><div class="bar" id="timer-bar" style="width:${r ? (r.remainingMs / (r.duration * 1000) * 100).toFixed(1) : 100}%"></div></div></div>${r ? `<div class="buttons"><button class="btn ${r.running ? 'lav' : 'green'} row-btn" data-action="toggle-timer" ${r.expired ? 'disabled' : ''}>${r.running ? '❚❚ PAUZA' : '▶ ' + (r.remainingMs === r.duration * 1000 ? 'START' : 'CONTINUA')}</button><button class="btn blue" data-action="reset-timer">↺ RESET</button><button class="btn red" data-action="end-now">✓ FINALIZEAZA</button></div><div class="buttons"><button class="btn sm" data-action="cancel-round">X ANULEAZA RUNDA</button><button class="btn sm pink" data-action="open-results">ECHIPE / REZULTATE</button></div>` : `<button class="btn primary full" style="font-size:20px;min-height:67px;transform:rotate(-1deg)" data-action="random">🎲 DA-I RANDOM !!!</button><div class="buttons"><button class="btn sm blue" data-action="nav" data-view="challenges">ALEGE TU UN CHALLENGE</button></div>`}<div class="machine-bottom"><span class="scribble">↳ nu apasa de doua ori. sau da?</span><span class="counter">Runda #${st.history.length + 1}</span></div></section><aside class="panel"><h3 class="panel-title">ECHIPE IN JOC <span class="small-stamp">LIVE</span></h3>${st.teams.length ? st.teams.map(t => `<div class="team-mini"><div><b><span class="team-bullet" style="background:${COLORS[t.color] || COLORS.banana}"></span>${escapeHtml(t.name)}</b><small>${t.members.length} coechipieri</small><span class="chip score-chip">${t.score} PCT</span></div>${r ? statusButtons(t.id, r.statuses[t.id]) : '<span class="chip">PREGATIT</span>'}</div>`).join('') : '<div class="empty-mini">Nu avem echipe. Adauga una!</div>'}${r ? `<p class="help">Poti bifa RAMAS sau IESIT oricand. Dupa timer, confirmam final toti.</p><button class="btn sm full blue" data-action="open-results">VERIFICA TOATE ECHIPELE</button>` : `<button class="btn sm full green" data-action="team-add">+ BAGA O ECHIPA</button>`}<div class="sidebar-meta"><h3 class="panel-title">ULTIMA RUNDA</h3>${lastResult()}</div></aside></section>`; }
    function statusButtons(id, v) { return `<div class="status-buttons"><button type="button" class="yes ${v === 'in' ? 'sel' : ''}" data-action="set-status" data-team="${escapeHtml(id)}" data-status="in" aria-pressed="${v === 'in'}">RAMAS</button><button type="button" class="no ${v === 'out' ? 'sel' : ''}" data-action="set-status" data-team="${escapeHtml(id)}" data-status="out" aria-pressed="${v === 'out'}">IESIT</button></div>`; }

    function renderChallenges() { return `<div class="row-heading"><div><h2 class="page-title">LISTA CU CHALLENGE-URI</h2><p class="page-lead">Editare, stergere, pauza si adaugare. ${st.challenges.length} in total, direct din PDF + ce mai pui tu.</p></div><div class="buttons"><button class="btn primary" data-action="challenge-add">+ CHALLENGE NOU</button><button class="btn sm blue" data-action="reset-challenges">REINC. DIN PDF</button></div></div><div class="summary-cards"><div class="summary-box"><div class="summary-value">${st.challenges.length}</div><div class="summary-text">CHALLENGE-URI</div></div><div class="summary-box"><div class="summary-value">${st.challenges.filter(c => c.difficulty === 'easy').length}</div><div class="summary-text">USOARE / VERZI</div></div><div class="summary-box"><div class="summary-value">${st.challenges.filter(c => c.difficulty === 'hard').length}</div><div class="summary-text">GRELE / ROSII</div></div></div>${st.challenges.length ? `<div class="list-grid">${st.challenges.map((c, i) => `<article class="card item-card ${c.active ? '' : 'is-off'}"><div class="item-top"><div class="eyebrow">#${String(i + 1).padStart(2, '0')} ${c.active ? '● ACTIV' : '○ OPRIT'}</div><span class="chip ${c.active ? 'easy' : 'hard'}">${c.active ? 'IN SAC' : 'PAUZAT'}</span></div><h3>${escapeHtml(c.name)}</h3><p>${escapeHtml(c.description)}</p><div class="row-meta">${categoryChip(c)}${difficultyChip(c)}${timeChip(c)}</div><div class="row-actions"><button class="btn sm green" data-action="select-challenge" data-id="${escapeHtml(c.id)}" ${!c.active || !!st.round ? 'disabled' : ''}>▶ JOACA</button><button class="btn sm blue" data-action="challenge-edit" data-id="${escapeHtml(c.id)}">✎ EDIT</button><button class="btn sm" data-action="challenge-toggle" data-id="${escapeHtml(c.id)}">${c.active ? 'OPRESTE' : 'ACTIVEAZA'}</button><button class="btn sm red" data-action="challenge-delete" data-id="${escapeHtml(c.id)}">X</button></div></article>`).join('')}</div>` : '<div class="nothing"><div class="big">:(</div><p>Nu mai ai challenge-uri. Adauga ceva.</p></div>'}`; }
    function renderTeams() { return `<div class="row-heading"><div><h2 class="page-title">ECHIPE + COECHIPIERI</h2><p class="page-lead">Poti pune oricate echipe vrei. Pentru fiecare alegem daca a ramas sau a iesit.</p></div><button class="btn primary" data-action="team-add">+ ECHIPA NOUA</button></div>${st.teams.length ? `<div class="team-list">${st.teams.map((t, i) => `<article class="card team-card" style="border-top:10px solid ${COLORS[t.color] || COLORS.banana}"><div class="eyebrow">ECHIPA NR. ${i + 1}</div><h3>${escapeHtml(t.name)}</h3><div class="score-line"><span class="score-number">${t.score} PCT</span><button class="btn sm blue" data-action="nav" data-view="scores">CLASAMENT</button></div><div class="member-count">${t.members.length} COECHIPIERI IN ECHIPA</div><div>${t.members.map(n => `<span class="member-chip">${escapeHtml(n)}</span>`).join('') || '<span class="muted">Nimeni inscris momentan</span>'}</div>${st.round ? `<p>${statusButtons(t.id, st.round.statuses[t.id])}</p>` : ''}<div class="row-actions"><button class="btn sm blue" data-action="team-edit" data-id="${escapeHtml(t.id)}">✎ EDIT ECHIPA</button><button class="btn sm red" data-action="team-delete" data-id="${escapeHtml(t.id)}">X STERGE</button></div></article>`).join('')}</div>` : '<div class="nothing"><div class="big">☆</div><p>Nici o echipa?! Pai cu cine ne jucam?</p><button class="btn primary" data-action="team-add">ADAUGA PRIMA ECHIPA</button></div>'}`; }

    else if (e.target.matches('[data-overlay]'))
        closeModal(); });
    document.addEventListener('submit', e => { const f = e.target; if (!['challenge-form', 'team-form', 'settings-form'].includes(f.id))
        return; e.preventDefault(); e.stopPropagation(); saveFormById(f.id); }, true);
    document.addEventListener('change', async (e) => { const t = e.target; if (t.dataset.change === 'quick-mode') {
        st.schedule.mode = t.value;
        scheduleNext();
        render();
        notify('Mod schimbat in ' + t.value);
    } if (t.dataset.change === 'quick-reward') {
        st.reward = t.value;
        save();
        render();
        notify('Premiul este selectat.');
    } if (t.id === 'import-file' && t.files?.[0]) {
        try {
            const data = JSON.parse(await t.files[0].text());
            if (!Array.isArray(data.challenges) || !Array.isArray(data.teams) || !Array.isArray(data.history))
                throw Error('Format gresit');
            const d = base();
            st = scoruri({ ...d, ...data, schedule: { ...d.schedule, ...data.schedule }, round: null, nextAutoAt: null });
            st.used = Array.isArray(st.used) ? st.used : [];
            if (!['manual', 'random', 'fixed'].includes(st.schedule.mode))
                st.schedule.mode = 'manual';
            scheduleNext();
            save();
            closeModal();
            pg = 'play';
            render();
            notify('Backup importat cu succes!');
        }
        catch {
            notify('Fisier invalid! Trebuie backup din aplicatie.');
        }
    } });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && mod)
        closeModal(); if (e.key === ' ' && pg === 'play' && !mod && st.round && e.target === document.body) {
        e.preventDefault();
        toggleTime();
    } });
    window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) {
        st = readState();
        render();
    } });
    if (st.round?.running && Date.now() >= st.round.endsAt) {
        st.round.remainingMs = 0;
        st.round.running = false;
        st.round.expired = true;
        st.round.endsAt = null;
        save();
        setTimeout(() => showModal('results'), 40);
    }
    if (st.schedule.mode !== 'manual' && !st.nextAutoAt && !st.round)
        scheduleNext();
    render();
    setInterval(tick, 190);
    if (new URLSearchParams(location.search).has('pop'))
        setTimeout(() => { if (!st.round)
            launchChallenge(null, true);
        else {
            pg = 'play';
            render();
            notify('Exista deja un challenge!');
        } }, 180);
    if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { }));
})();
</script>
</body>
</html>
